<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FUT Objectives Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#070b10;
    --surface:#0d141c;
    --surface2:#121b25;
    --border:#1e2c39;
    --text:#e9f3ef;
    --muted:#7d94a3;
    --accent:#39ff8a;
    --accent-strong:#7dffb3;
    --accent-soft:rgba(57,255,138,.13);
    --accent-glow:rgba(57,255,138,.55);
    --cyan:#28e0ff;
    --gold:#ffcf40;
    --danger:#ff4d6d;
    --success:#39ff8a;
    --success-soft:rgba(57,255,138,.14);
    --track:#141f29;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 26px -14px rgba(0,0,0,.75);
    --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{
    margin:0;
    background:
      radial-gradient(1100px 550px at 12% -12%, rgba(57,255,138,.11), transparent 60%),
      radial-gradient(900px 520px at 105% 0%, rgba(40,224,255,.09), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 2px, transparent 2px 42px),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
    padding-inline:16px;
    padding-block:0 24px;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  h1,h2,h3,.display{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;text-wrap:balance;}
  .tab-num,.count,.progress-label,input[type="number"]{font-variant-numeric:tabular-nums;}
  a{color:var(--accent-strong);}

  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:
      radial-gradient(700px 220px at 10% 0%, rgba(57,255,138,.08), transparent 70%),
      var(--bg);
    padding-top:16px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 var(--accent-glow);
    margin-inline:-16px;
    padding-inline:16px;
  }
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .titleblock h1{
    font-family:'Orbitron',system-ui,sans-serif;font-weight:800;
    font-size:19px;letter-spacing:1.2px;margin:0;line-height:1.2;
    text-transform:uppercase;color:var(--text);
    text-shadow:0 0 14px var(--accent-glow);
  }
  .titleblock .sub{
    color:var(--muted);font-size:11.5px;margin-top:5px;letter-spacing:.4px;
    text-transform:uppercase;font-family:'Rajdhani',sans-serif;font-weight:600;
  }
  .save-pill{
    display:flex;align-items:center;gap:7px;
    font-size:11px;color:var(--muted);letter-spacing:.3px;
    padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);
    white-space:nowrap;text-transform:uppercase;font-family:'Rajdhani',sans-serif;font-weight:600;
  }
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--accent-glow);}
  .save-pill.saving .save-dot{background:var(--gold);box-shadow:0 0 8px rgba(255,207,64,.6);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .overall{
    margin-top:14px;
    display:flex;align-items:center;gap:12px;
  }
  .ring{
    --pct:0;
    width:54px;height:54px;border-radius:50%;flex:none;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--track) 0);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    filter:drop-shadow(0 0 8px var(--accent-glow));
  }
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg);}
  .ring span{position:relative;font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;color:var(--accent-strong);}
  .overall-text{font-size:12px;color:var(--muted);letter-spacing:.2px;}
  .overall-text b{
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;
  }

  .search{
    margin-top:12px;
    display:flex;align-items:center;gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:9px 12px;
    transition:border-color .15s,box-shadow .15s;
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search input{
    border:none;outline:none;background:transparent;color:var(--text);
    font-family:'Manrope',sans-serif;font-size:14px;width:100%;
  }
  .search input::placeholder{color:var(--muted);}
  .search svg{flex:none;color:var(--muted);}

  .tabs{
    display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;position:relative;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:.6px;
    text-transform:uppercase;
    padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
    transition:background .15s,color .15s,border-color .15s,box-shadow .15s;
  }
  .tab::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;background:var(--muted);opacity:.6;}
  .tab:nth-child(1)::before{background:var(--gold);}
  .tab:nth-child(2)::before{background:#39ff8a;}
  .tab:nth-child(3)::before{background:#28e0ff;}
  .tab:nth-child(4)::before{background:#ffb020;}
  .tab:nth-child(5)::before{background:#ff3ec8;}
  .tab:nth-child(6)::before{background:#ff8a3d;}
  .tab:nth-child(7)::before{background:#9d6bff;}
  .tab:nth-child(8)::before{background:#ff4d6d;}
  .tab .tab-num{font-size:10.5px;opacity:.8;}
  .tab.active{
    background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent);
    box-shadow:0 0 14px var(--accent-glow);
  }
  .tab.active::before{background:var(--accent);box-shadow:0 0 6px var(--accent-glow);opacity:1;}

  main{padding-top:16px;}
  .cat-sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
  .cat-heading{font-size:13px;color:var(--accent-strong);margin:18px 0 8px;letter-spacing:.3px;text-transform:uppercase;}

  .groups{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;}
  .card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.025), transparent 40%), var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--cyan);
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    box-shadow:var(--shadow);
    padding:14px 16px 12px 14px;
    transition:box-shadow .2s,border-color .2s;
  }
  .card:hover{box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.03);}
  .card.done{border-left-color:var(--success);box-shadow:var(--shadow),0 0 18px -6px var(--accent-glow);}
  .card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .card-title{flex:1;min-width:0;}
  .card-actions{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
  .fav-btn{
    width:24px;height:24px;border:none;background:transparent;padding:0;margin:0;
    cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;
    transition:color .15s,transform .15s;-webkit-tap-highlight-color:transparent;
  }
  .fav-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;transition:fill .15s,stroke .15s;}
  .fav-btn:hover{color:var(--gold);transform:scale(1.12);}
  .fav-btn.on{color:var(--gold);}
  .fav-btn.on svg{fill:var(--gold);stroke:var(--gold);filter:drop-shadow(0 0 4px rgba(255,207,64,.6));}
  .card-head h3{font-size:15.5px;margin:0;line-height:1.3;text-wrap:balance;letter-spacing:.2px;}
  .card-desc{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.5;
    border-left:2px solid var(--border);padding-left:8px;
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .chip{
    font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);
    padding:3px 9px;border-radius:999px;max-width:100%;letter-spacing:.2px;
    font-family:'Rajdhani',sans-serif;font-weight:600;text-transform:uppercase;
  }
  .chip.time{
    color:#ffd7de;border-color:rgba(255,77,109,.4);background:rgba(255,77,109,.12);
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip.time::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--danger);box-shadow:0 0 6px var(--danger);animation:pulse 1.4s infinite;}
  .chip.note{color:var(--cyan);border-color:rgba(40,224,255,.35);background:rgba(40,224,255,.08);}
  .chip:not(.time):not(.note):first-child{color:var(--gold);border-color:rgba(255,207,64,.3);background:rgba(255,207,64,.08);}
  .group-progress{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:12.5px;color:var(--muted);
    flex:none;white-space:nowrap;
  }
  .group-progress.full{color:var(--accent-strong);text-shadow:0 0 8px var(--accent-glow);}
  .bar{height:6px;border-radius:99px;background:var(--track);margin:10px 0 10px;overflow:hidden;position:relative;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:99px;box-shadow:0 0 8px var(--accent-glow);}
  .bar.full > i{background:var(--accent);box-shadow:0 0 10px var(--accent-glow);}

  .obj-list{display:flex;flex-direction:column;gap:2px;}
  .obj-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:7px 6px;border-radius:6px;border-left:2px solid transparent;
    transition:background .15s,border-color .15s;
  }
  .obj-row:hover{background:var(--surface2);border-left-color:var(--cyan);}
  .chk{
    flex:none;width:22px;height:22px;border:1.6px solid var(--border);
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,box-shadow .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .chk svg{width:12px;height:12px;opacity:0;transition:opacity .12s;color:#04160d;}
  .chk.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
  .chk.on svg{opacity:1;}
  .obj-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px;}
  .obj-name{font-size:14px;min-width:0;font-weight:500;}
  .obj-name .done-text{color:var(--muted);text-decoration:line-through;}
  .obj-desc{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5;}
  .obj-reward{color:var(--gold);}
  .progress-input{
    flex:none;display:flex;align-items:center;gap:5px;
    font-size:12px;color:var(--muted);
    padding-top:2px;font-family:'Rajdhani',sans-serif;
  }
  .progress-input input[type="number"]{
    width:54px;text-align:right;background:var(--surface2);border:1px solid var(--border);
    border-radius:6px;padding:4px 6px;color:var(--accent-strong);font-size:13px;font-weight:600;
  }
  .progress-input input[type="number"]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .target{color:var(--muted);}

  .empty{color:var(--muted);font-size:13.5px;padding:30px 4px;text-align:center;}
  footer.credit{
    color:var(--muted);font-size:11px;text-align:center;margin-top:26px;
    letter-spacing:.3px;text-transform:uppercase;font-family:'Rajdhani',sans-serif;
    border-top:1px solid var(--border);padding-top:14px;
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;}}
</style>

<script id="app-src" type="text/plain">
(function(){
  var DATA = JSON.parse(document.getElementById('data-json').textContent);
  var STATE = JSON.parse(document.getElementById('state-json').textContent);
  if(!STATE._favs) STATE._favs = {};
  var activeTab = DATA[0].id;
  var query = "";
  var saveTimer = null;
  var artifactCap = null;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function fmt(n){ return Number(n).toLocaleString('es-ES'); }

  function groupCounts(g){
    var done = 0;
    g.objectives.forEach(function(o){ if(STATE[o.id] && STATE[o.id].done) done++; });
    return {done: done, total: g.objectives.length};
  }
  function groupProgressPct(g){
    if(!g.objectives.length) return 0;
    var sum = 0;
    g.objectives.forEach(function(o){
      var st = STATE[o.id] || {current:0, done:false};
      var target = o.target || 1;
      var ratio = st.done ? 1 : Math.max(0, Math.min(1, (Number(st.current)||0) / target));
      sum += ratio;
    });
    return Math.round((sum / g.objectives.length) * 100);
  }
  function findObjAndGroup(oid){
    var found = null;
    DATA.forEach(function(cat){
      cat.groups.forEach(function(g){
        g.objectives.forEach(function(o){ if(o.id === oid) found = {o:o, g:g, cat:cat}; });
      });
    });
    return found;
  }
  function catCounts(cat){
    var done = 0, total = 0;
    cat.groups.forEach(function(g){ var c = groupCounts(g); done += c.done; total += c.total; });
    return {done: done, total: total};
  }
  function overallCounts(){
    var done = 0, total = 0;
    DATA.forEach(function(cat){ var c = catCounts(cat); done += c.done; total += c.total; });
    return {done: done, total: total};
  }

  function favGroups(){
    var out = [];
    DATA.forEach(function(cat){
      cat.groups.forEach(function(g){
        if(STATE._favs && STATE._favs[g.id]) out.push({g: g, catTitle: cat.title});
      });
    });
    return out;
  }
  function favCounts(){
    var done = 0, total = 0;
    favGroups().forEach(function(item){ var c = groupCounts(item.g); done += c.done; total += c.total; });
    return {done: done, total: total};
  }

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var SEARCH_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 3.3l2.62 5.53 6.03.66-4.5 4.15 1.22 6-5.37-3-5.37 3 1.22-6-4.5-4.15 6.03-.66z"/></svg>';

  function renderObjRow(o){
    var st = STATE[o.id] || {current:0, done:false};
    var done = st.done;
    var showNumber = o.target > 1;
    var numberHtml = showNumber
      ? '<span class="progress-input"><input type="number" inputmode="numeric" min="0" max="'+o.target+'" value="'+st.current+'" data-oid="'+o.id+'" class="obj-number" id="num-'+o.id+'"> <span class="target">/ '+fmt(o.target)+'</span></span>'
      : '';
    var descHtml = '';
    if(o.desc){
      descHtml += '<span class="obj-desc">“'+escapeHtml(o.desc)+'”';
      if(o.reward) descHtml += ' <span class="obj-reward">— '+escapeHtml(o.reward)+'</span>';
      descHtml += '</span>';
    }
    return '' +
      '<div class="obj-row" id="objrow-'+o.id+'">' +
        '<button type="button" class="chk'+(done?' on':'')+'" data-oid="'+o.id+'" aria-pressed="'+done+'" aria-label="Marcar '+escapeHtml(o.name)+'">'+CHECK_SVG+'</button>' +
        '<div class="obj-main">' +
          '<span class="obj-name">'+(done?'<span class="done-text">'+escapeHtml(o.name)+'</span>':escapeHtml(o.name))+'</span>' +
          descHtml +
        '</div>' +
        numberHtml +
      '</div>';
  }

  function renderGroup(g, catTitle){
    var c = groupCounts(g);
    var full = c.done === c.total;
    var chips = '<span class="chip">'+escapeHtml(g.reward)+'</span>';
    if(g.timeLeft) chips += '<span class="chip time">'+escapeHtml(g.timeLeft)+' restantes</span>';
    if(g.note) chips += '<span class="chip note">'+escapeHtml(g.note)+'</span>';
    if(catTitle) chips += '<span class="chip">'+escapeHtml(catTitle)+'</span>';
    var pct = groupProgressPct(g);
    var groupDescHtml = g.desc ? '<p class="card-desc">“'+escapeHtml(g.desc)+'”</p>' : '';
    var isFav = !!(STATE._favs && STATE._favs[g.id]);
    var favBtn = '<button type="button" class="fav-btn'+(isFav?' on':'')+'" data-gid="'+g.id+'" aria-pressed="'+isFav+'" aria-label="Marcar '+escapeHtml(g.name)+' como favorito">'+STAR_SVG+'</button>';
    return '' +
      '<div class="card'+(full?' done':'')+'" id="card-'+g.id+'">' +
        '<div class="card-head">' +
          '<div class="card-title"><h3>'+escapeHtml(g.name)+'</h3>'+groupDescHtml+'<div class="chips">'+chips+'</div></div>' +
          '<div class="card-actions">'+favBtn+'<div class="group-progress'+(full?' full':'')+'">'+c.done+'/'+c.total+'</div></div>' +
        '</div>' +
        '<div class="bar'+(full?' full':'')+'"><i style="width:'+pct+'%"></i></div>' +
        '<div class="obj-list">'+g.objectives.map(renderObjRow).join('')+'</div>' +
      '</div>';
  }

  function matchesQuery(g, cat){
    if(!query) return true;
    var q = query.toLowerCase();
    if(g.name.toLowerCase().indexOf(q) !== -1) return true;
    if(cat.title.toLowerCase().indexOf(q) !== -1) return true;
    if(g.desc && g.desc.toLowerCase().indexOf(q) !== -1) return true;
    return g.objectives.some(function(o){
      if(o.name.toLowerCase().indexOf(q) !== -1) return true;
      if(o.desc && o.desc.toLowerCase().indexOf(q) !== -1) return true;
      return false;
    });
  }

  function render(){
    var root = document.getElementById('root');
    var oc = overallCounts();
    var pct = oc.total ? Math.round((oc.done/oc.total)*100) : 0;

    var fc = favCounts();
    var favTabHtml = '<button type="button" class="tab'+(activeTab==='favorites' && !query ?' active':'')+'" data-tab="favorites">'+
      'Favoritos <span class="tab-num" id="tabnum-favorites">'+fc.done+'/'+fc.total+'</span></button>';
    var tabsHtml = favTabHtml + DATA.map(function(cat){
      var cc = catCounts(cat);
      return '<button type="button" class="tab'+(cat.id===activeTab && !query ?' active':'')+'" data-tab="'+cat.id+'">'+
        escapeHtml(cat.title)+' <span class="tab-num" id="tabnum-'+cat.id+'">'+cc.done+'/'+cc.total+'</span></button>';
    }).join('');

    var bodyHtml = '';
    if(query){
      DATA.forEach(function(cat){
        var groups = cat.groups.filter(function(g){ return matchesQuery(g, cat); });
        if(groups.length){
          bodyHtml += groups.map(function(g){ return renderGroup(g, cat.title); }).join('');
        }
      });
      if(!bodyHtml){
        bodyHtml = '<div class="empty">Sin resultados para "'+escapeHtml(query)+'".</div>';
      }
    } else if(activeTab === 'favorites'){
      var favs = favGroups();
      if(favs.length){
        bodyHtml = '<p class="cat-sub">Objetivos que estás llevando en paralelo ahora mismo. Toca la estrella de cualquier tarjeta para añadirla o quitarla de aquí.</p>' +
          '<div class="groups">'+favs.map(function(item){ return renderGroup(item.g, item.catTitle); }).join('')+'</div>';
      } else {
        bodyHtml = '<div class="empty">Aún no tienes favoritos. Toca la estrella ☆ en la esquina de cualquier objetivo para fijarlo aquí.</div>';
      }
    } else {
      var cat = DATA.find(function(c){ return c.id === activeTab; }) || DATA[0];
      bodyHtml = '<p class="cat-sub">'+escapeHtml(cat.subtitle||'')+'</p>' +
        '<div class="groups">'+cat.groups.map(function(g){ return renderGroup(g, null); }).join('')+'</div>';
    }

    root.innerHTML = '' +
      '<header class="top">' +
        '<div class="top-row">' +
          '<div class="titleblock">' +
            '<h1>FUT Objectives Tracker</h1>' +
            '<div class="sub">EA FC 27 Ultimate Team &middot; @paleta &middot; Berlin SC</div>' +
          '</div>' +
          '<div class="save-pill" id="save-pill"><span class="save-dot"></span><span id="save-text">Guardado</span></div>' +
        '</div>' +
        '<div class="overall">' +
          '<div class="ring" id="overall-ring" style="--pct:'+pct+'"><span id="overall-pct-text">'+pct+'%</span></div>' +
          '<div class="overall-text"><b id="overall-count-num">'+oc.done+' / '+oc.total+'</b> objetivos completados en total</div>' +
        '</div>' +
        '<div class="search">'+SEARCH_SVG+'<input type="text" id="search-input" placeholder="Buscar objetivo o grupo&hellip;" value="'+escapeHtml(query)+'"></div>' +
        '<div class="tabs">'+tabsHtml+'</div>' +
      '</header>' +
      '<main>'+bodyHtml+'</main>' +
      '<footer class="credit">Progreso guardado en esta p&aacute;gina &mdash; ábrela cuando quieras seguir marcando objetivos.</footer>';

    wireEvents();
  }

  function setDot(mode){
    var pill = document.getElementById('save-pill');
    var text = document.getElementById('save-text');
    if(!pill) return;
    pill.classList.toggle('saving', mode === 'saving');
    if(mode === 'saving') text.textContent = 'Guardando…';
    else if(mode === 'nosave') text.textContent = 'Sin guardar (solo en esta vista)';
    else text.textContent = 'Guardado';
  }

  function scheduleSave(){
    setDot('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }

  function doSave(){
    if(!artifactCap){ setDot('nosave'); return; }
    artifactCap.publish(serializeDocument(STATE)).then(function(){
      setDot('saved');
    }).catch(function(){
      setDot('nosave');
    });
  }

  function toggleObjective(oid){
    var target = null;
    DATA.forEach(function(cat){ cat.groups.forEach(function(g){ g.objectives.forEach(function(o){ if(o.id===oid) target = o; }); }); });
    if(!target) return;
    var st = STATE[oid] || {current:0, done:false};
    if(st.done){ st.current = 0; st.done = false; }
    else { st.current = target.target; st.done = true; }
    STATE[oid] = st;
    render();
    scheduleSave();
  }

  function setNumber(oid, value){
    var target = null;
    DATA.forEach(function(cat){ cat.groups.forEach(function(g){ g.objectives.forEach(function(o){ if(o.id===oid) target = o; }); }); });
    if(!target) return;
    var n = Math.max(0, Math.min(target.target, Math.round(Number(value)||0)));
    STATE[oid] = {current:n, done:n>=target.target};
    scheduleSave();
    return n;
  }

  function refreshObjRow(o){
    var row = document.getElementById('objrow-'+o.id);
    if(!row) return;
    var st = STATE[o.id] || {current:0, done:false};
    var chk = row.querySelector('.chk');
    if(chk){
      chk.classList.toggle('on', !!st.done);
      chk.setAttribute('aria-pressed', !!st.done);
    }
    var nameEl = row.querySelector('.obj-name');
    if(nameEl){
      nameEl.innerHTML = st.done ? '<span class="done-text">'+escapeHtml(o.name)+'</span>' : escapeHtml(o.name);
    }
  }

  function refreshGroupUI(g){
    var card = document.getElementById('card-'+g.id);
    if(!card) return;
    var c = groupCounts(g);
    var full = c.done === c.total;
    var pct = groupProgressPct(g);
    card.classList.toggle('done', full);
    var bar = card.querySelector('.bar');
    if(bar){
      bar.classList.toggle('full', full);
      var fill = bar.querySelector('i');
      if(fill) fill.style.width = pct+'%';
    }
    var badge = card.querySelector('.group-progress');
    if(badge){
      badge.classList.toggle('full', full);
      badge.textContent = c.done+'/'+c.total;
    }
  }

  function refreshHeaderCounts(){
    var oc = overallCounts();
    var pct = oc.total ? Math.round((oc.done/oc.total)*100) : 0;
    var ring = document.getElementById('overall-ring');
    if(ring){
      ring.style.setProperty('--pct', pct);
      var pctText = document.getElementById('overall-pct-text');
      if(pctText) pctText.textContent = pct+'%';
    }
    var countNum = document.getElementById('overall-count-num');
    if(countNum) countNum.textContent = oc.done+' / '+oc.total;

    DATA.forEach(function(cat){
      var cc = catCounts(cat);
      var el = document.getElementById('tabnum-'+cat.id);
      if(el) el.textContent = cc.done+'/'+cc.total;
    });
    var fc = favCounts();
    var favEl = document.getElementById('tabnum-favorites');
    if(favEl) favEl.textContent = fc.done+'/'+fc.total;
  }

  function liveUpdateNumber(oid, rawValue){
    var found = findObjAndGroup(oid);
    if(!found) return;
    var target = found.o.target;
    var n = Math.max(0, Math.min(target, Math.round(Number(rawValue)||0)));
    STATE[oid] = {current: n, done: n >= target};
    refreshObjRow(found.o);
    refreshGroupUI(found.g);
    refreshHeaderCounts();
    scheduleSave();
  }

  function toggleFavorite(gid){
    if(!STATE._favs) STATE._favs = {};

    else STATE._favs[gid] = true;

  }

    document.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        activeTab = btn.getAttribute('data-tab');
        query = "";
        render();
      });
    });
    document.querySelectorAll('.chk').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleObjective(btn.getAttribute('data-oid')); });
    });
    document.querySelectorAll('.fav-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        toggleFavorite(btn.getAttribute('data-gid'));
      });
    });
    document.querySelectorAll('.obj-number').forEach(function(inp){
      inp.addEventListener('input', function(){
        liveUpdateNumber(inp.getAttribute('data-oid'), inp.value);
      });
      inp.addEventListener('change', function(){
        setNumber(inp.getAttribute('data-oid'), inp.value);
        render();
      });
    });
    var search = document.getElementById('search-input');
    if(search){
      search.addEventListener('input', function(){
        query = search.value;
        render();
        var el = document.getElementById('search-input');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
  }

  function serializeDocument(state){
    var styleText = document.getElementById('app-style').outerHTML;
    var scriptText = document.getElementById('app-src').textContent;
    var fontLinks = '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">';
    var dataText = document.getElementById('data-json').textContent;
    var stateText = JSON.stringify(state);
    return '' +
      '<!DOCTYPE html>' +
      '<html lang="es"><head>' +
      '<meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
      '<title>FUT Objectives Tracker</title>' +
      fontLinks + styleText +
      '</head><body>' +
      '<div id="root"></div>' +
      '<script id="data-json" type="application/json">' + dataText + '<\/script>' +
      '<script id="state-json" type="application/json">' + stateText + '<\/script>' +
      '<script id="app-src" type="text/plain">' + scriptText + '<\/script>' +
      '<script>(function(){var s=document.getElementById("app-src").textContent;(new Function(s))();})();<\/script>' +
      '</body></html>';
  }

  async function init(savedUi){
    if(savedUi && savedUi.activeTab) activeTab = savedUi.activeTab;
    if(savedUi && typeof savedUi.query === 'string') query = savedUi.query;
    render();
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        artifactCap = await window.claude.use('artifact');
      }
    }catch(e){ artifactCap = null; }
  }

  if(window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function'){
    window.claude.hot.snapshot(function(){ return {activeTab: activeTab, query: query}; });
  }
  var start = function(savedUi){ init(savedUi); };
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude && window.claude.hot ? window.claude.hot.data : undefined);
  }
})();
</script>
<script>(function(){var s=document.getElementById("app-src").textContent;(new Function(s))();})();</script>
</body></html>
